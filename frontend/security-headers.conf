# Cabeceras de seguridad del frontend (EF3)
# Se incluyen en cada "location" de nginx.conf: en nginx, un add_header dentro de un location
# reemplaza a todos los del nivel superior, así que no basta con ponerlas una vez en el server.

# Política de seguridad de contenido (CSP): el navegador solo ejecuta y carga lo que aparece aquí.
# Si alguien lograra guardar un <script> en un texto, el navegador no lo ejecutaría (protección contra XSS).
#   script-src 'self'           solo los archivos .js de la app, ningún script escrito dentro del HTML
#   style-src 'unsafe-inline'   Ionic agrega estilos en línea a sus componentes
#   img-src data: i.ytimg.com   íconos de Ionic y miniaturas de YouTube en el formulario de recursos
#   media-src https:            audios y videos de /media/ o de otros sitios con https
#   connect-src 'self' data:    la API (misma dirección, /api) y los íconos de Ionic
#   frame-src youtube-nocookie  el reproductor de YouTube
#   frame-ancestors 'none'      nadie puede mostrar la app dentro de un iframe (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; media-src 'self' https:; connect-src 'self' data:; frame-src https://www.youtube-nocookie.com; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# El navegador no adivina el tipo de un archivo (evita que un texto se ejecute como script)
add_header X-Content-Type-Options "nosniff" always;
# Respaldo de frame-ancestors para navegadores antiguos
add_header X-Frame-Options "DENY" always;
# A otros sitios solo se les envía el origen (sin la ruta), por ejemplo al reproducir un video de YouTube
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La app no usa cámara, micrófono, ubicación ni pagos
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
