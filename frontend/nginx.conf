# Servidor web del frontend (nginx)
server {
  listen 80;
  server_name _;

  # Archivos compilados del frontend
  root /usr/share/nginx/html;
  index index.html;

  # No mostrar la versión de nginx en las respuestas
  server_tokens off;

  # Comprime el texto (JS, CSS, JSON)
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Todo lo que empieza con /api se reenvía al contenedor de la API
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # IP real del usuario (la API la usa en el límite de intentos de login)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos de Vite: llevan un código en el nombre que cambia en cada build,
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rutas de la aplicación (/login, /app/home, /admin...): si no es un archivo,
  # se responde index.html y React Router muestra la pantalla que corresponde
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}